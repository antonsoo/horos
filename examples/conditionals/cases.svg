<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="current-conditional-experiment-title current-conditional-experiment-desc"><title id="current-conditional-experiment-title">If it is day, I am talking.</title><desc id="current-conditional-experiment-desc">Four truth assignments with the selected present case and admitted cases. A modern finite compatibility experiment beside Sextus Empiricus, Outlines II.110–114.</desc><rect width="760" height="440" fill="#eef3f6"/><g fill="#173448" font-family="sans-serif"><text x="24" y="43" font-size="25">If it is day, I am talking.</text><text x="24" y="78" font-size="16">Daylight and speech are independently assigned.</text><g><rect x="24" y="103" width="712" height="50" fill="#d9eaf0" stroke="#9aadb8"/><text x="38" y="134" font-size="18">Day, talking</text><text x="460" y="134" font-size="17">Admitted</text><text x="612" y="134" font-size="17">Current</text></g><g><rect x="24" y="161" width="712" height="50" fill="#f9fcfd" stroke="#9aadb8"/><text x="38" y="192" font-size="18">Day, silent</text><text x="460" y="192" font-size="17">Excluded</text><text x="612" y="192" font-size="17"></text></g><g><rect x="24" y="219" width="712" height="50" fill="#f9fcfd" stroke="#9aadb8"/><text x="38" y="250" font-size="18">Night, talking</text><text x="460" y="250" font-size="17">Admitted</text><text x="612" y="250" font-size="17"></text></g><g><rect x="24" y="277" width="712" height="50" fill="#f9fcfd" stroke="#9aadb8"/><text x="38" y="308" font-size="18">Night, silent</text><text x="460" y="308" font-size="17">Admitted</text><text x="612" y="308" font-size="17"></text></g><text x="24" y="377" font-size="15">Admitted cases are assumptions. Excluding a row does not prove it impossible.</text><text x="24" y="403" font-size="15">Sextus Empiricus, Outlines II.110–114. Modern diagram by Anthony Mercer.</text></g></svg>